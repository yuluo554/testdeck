name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: test (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (README extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Sprint layout gate (methodology binding)
        run: python tools/check-sprint-layout.py

      - name: Selftest (console script, README form)
        run: testdeck selftest

      - name: Selftest (module form)
        run: python -m testdeck selftest

      - name: Tests
        run: python -m pytest -q

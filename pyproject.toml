[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "testdeck"
version = "0.1.0"
description = "测试结果终端工作台：把多次 run 的 JUnit XML 归一到本地 SQLite，用三栏 TUI 看谁在抖、谁在变慢、这次是不是新坏"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "yuluo554" }]
keywords = ["junit", "tui", "textual", "flaky", "test-report", "ci"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Terminals",
]
dependencies = ["textual>=0.80,<2"]

[project.optional-dependencies]
dev = ["pytest>=7,<9"]

[project.scripts]
testdeck = "testdeck.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
